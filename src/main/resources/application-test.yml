spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL;NON_KEYWORDS=MONTH,YEAR
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

app:
  mail:
    enabled: false
  jwtSecret: SmartExpenseManagerTestJwtSecretKeyForTestingPurposesOnlyMustBeAtLeast64BytesLong1234567890
  jwtExpirationMs: 3600000
  jwtRefreshExpirationMs: 86400000

management:
  health:
    mail:
      enabled: false
    redis:
      enabled: false
