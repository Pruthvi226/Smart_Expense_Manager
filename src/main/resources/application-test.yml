spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MYSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

  kafka:
    listener:
      auto-startup: false

app:
  jwtSecret: SmartExpenseManagerTestJwtSecretKeyForTestingPurposesOnlyMustBeAtLeast64BytesLong1234567890
  jwtExpirationMs: 3600000
  jwtRefreshExpirationMs: 86400000
