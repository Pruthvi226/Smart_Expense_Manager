<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot password - Smart Expense Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="auth-page" data-page="forgot-password">
<button id="themeToggleButton" class="theme-toggle-fab" type="button" aria-label="Toggle theme">
    <svg class="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
    <svg class="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>
</button>
<main class="auth-shell">
    <section class="auth-panel">
        <a class="auth-brand" th:href="@{/login}" aria-label="Smart Expense Manager">
            <span class="brand-mark">SE</span>
            <span>
                <strong>Smart Expense</strong>
                <small>Manager</small>
            </span>
        </a>

        <div class="auth-copy">
            <p class="eyebrow">Account recovery</p>
            <h1>Reset your password</h1>
            <p>Enter your account email and Smart Expense Manager will prepare a secure reset link.</p>
        </div>

        <form id="forgotPasswordForm" class="auth-card" novalidate>
            <div id="forgotPasswordAlert" class="alert" hidden></div>
            <div id="forgotPasswordResult" class="reset-result" hidden></div>

            <label for="forgotPasswordEmail">Email</label>
            <input id="forgotPasswordEmail" name="email" type="email" autocomplete="email" required>

            <button class="primary-button" type="submit">Generate reset link</button>
            <p class="form-note">Remembered it? <a th:href="@{/login}">Back to sign in</a></p>
        </form>
    </section>
</main>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
