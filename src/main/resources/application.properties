# Server Configuration
server.port=${SERVER_PORT:${PORT:8080}}
server.servlet.context-path=${SERVER_SERVLET_CONTEXT_PATH:/}
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY:framework}

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smart_expense_manager?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.open-in-view=${SPRING_JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Application Name
spring.application.name=Smart Expense Manager

# JWT Configuration
app.jwtSecret=${APP_JWT_SECRET:SmartExpenseManagerDevelopmentJwtSecretKeyChangeMeAtLeast64CharactersLong}
app.jwtExpirationMs=${APP_JWT_EXPIRATION_MS:86400000}

# Swagger/OpenAPI Configuration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.api-docs.path=/v3/api-docs

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
