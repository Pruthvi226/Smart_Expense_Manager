spring:
  config:
    activate:
      on-profile: dev

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:smartexpensedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=MONTH,YEAR}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  flyway:
    enabled: false

  data:
    redis:
      repositories:
        enabled: false

app:
  jwtSecret: SmartExpenseManagerDevelopmentJwtSecretKeyChangeMeAtLeast64CharactersLongMustBeVeryLongKey1234567890
  jwtExpirationMs: 86400000
  jwtRefreshExpirationMs: 604800000
